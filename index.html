<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruler — Content Archive</title>
    <meta name="description" content="Ruler content archive.">
    <meta name="theme-color" content="#f3efe7">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23f3efe7'/%3E%3Cpath d='M18 48V16h15c8 0 13 4 13 11 0 5-3 9-8 10l10 11h-9L30 38h-5v10h-7Zm7-17h8c4 0 6-1 6-4s-2-4-6-4h-8v8Z' fill='%23181612'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css?v=20260507d">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
</head>
<body>
    <header class="site-header" id="top">
        <a class="brand" href="#top" aria-label="返回顶部">
            <span>Ruler</span>
            <small>Content Archive</small>
        </a>
        <nav class="top-nav" aria-label="页面导航">
            <a href="#current">近作</a>
            <a href="#categories">分类</a>
            <a href="#archive">索引</a>
            <a href="language-lab.html">语言实验</a>
        </nav>
        <button class="theme-toggle" id="theme-toggle" aria-label="切换主题" aria-pressed="false">Dark</button>
    </header>

    <main>
        <section class="masthead" id="current">
            <div class="masthead-title reveal-field" id="reveal-field" aria-label="文字探索区域">
                <div class="reveal-pattern" id="reveal-pattern" aria-hidden="true"></div>
                <div class="reveal-words" id="reveal-words" aria-hidden="true"></div>
                <div class="reveal-copy">
                    <p class="eyebrow">/content</p>
                    <p class="masthead-note">move through the archive / read what remains</p>
                </div>
                <section class="latest-section" aria-label="近作">
                    <aside class="latest-panel" id="latest-panel"></aside>
                </section>
            </div>
        </section>

        <section class="quote-strip" id="quote-strip" aria-label="内容摘录"></section>

        <section class="category-section" id="categories">
            <div class="section-line">
                <span>分类</span>
                <span id="total-count">0 entries</span>
            </div>
            <div class="category-grid" id="category-grid"></div>
        </section>

        <section class="archive-section" id="archive">
            <div class="archive-tools">
                <div>
                    <p class="eyebrow">Archive</p>
                    <h2>索引</h2>
                </div>
                <label class="search-box" for="search-input">
                    <span>Search</span>
                    <input id="search-input" type="search" autocomplete="off" placeholder="标题、正文、分类">
                </label>
            </div>
            <div class="filter-tabs" id="filter-tabs" aria-label="分类筛选"></div>
            <div class="archive-list" id="archive-list"></div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-records" aria-label="网站备案信息">
            <a class="record-link" href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=44090402441277" target="_blank" rel="noreferrer noopener">
                <img src="备案图标.png" alt="公安备案图标" width="18" height="20">
                <span>粤公网安备44090402441277号</span>
            </a>
            <a class="record-link" href="https://beian.miit.gov.cn/" target="_blank" rel="noreferrer noopener">粤ICP备2026022061号</a>
        </div>
        <a class="github-link" href="https://github.com/Ruler4396" target="_blank" rel="noreferrer noopener">GitHub 主页</a>
    </footer>

    <div class="reader" id="reader" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="reader-title">
        <button class="reader-backdrop" id="reader-backdrop" aria-label="关闭阅读器"></button>
        <article class="reader-panel">
            <div class="reader-progress"><span id="reader-progress-bar"></span></div>
            <header class="reader-header">
                <p class="reader-meta" id="reader-meta"></p>
                <h2 id="reader-title">标题</h2>
                <button class="reader-close" id="reader-close" aria-label="关闭阅读器">Close</button>
            </header>
            <div class="reader-body markdown-body" id="reader-body"></div>
        </article>
    </div>

    <script src="js/content-data.js?v=20260507d"></script>
    <script src="js/main.js?v=20260507d"></script>
</body>
</html>
